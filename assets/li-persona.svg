<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="EU internet user persona">
  <rect width="960" height="520" fill="#fffaf3"/>
  <rect x="40" y="40" width="880" height="440" rx="28" fill="#ffffff" stroke="#161514" stroke-width="3"/>
  <circle cx="160" cy="180" r="64" fill="#f5c84b" stroke="#161514" stroke-width="3"/>
  <text x="118" y="188" fill="#161514" font-family="Arial,sans-serif" font-size="28" font-weight="700">EU</text>
  <text x="260" y="130" fill="#161514" font-family="Georgia,serif" font-size="34" font-weight="700">Privacy-conscious internet user</text>
  <text x="260" y="168" fill="#6c655d" font-family="Arial,sans-serif" font-size="18">Age 2845 � shops, reads news, uses public services daily</text>
  <rect x="260" y="200" width="620" height="96" rx="16" fill="#fff6df" stroke="#ff5e44" stroke-width="2"/>
