  <text x="576" y="380" fill="#161514" font-size="15">Understand consent in plain language</text>
  <text x="260" y="430" fill="#ff5e44" font-family="Arial,sans-serif" font-size="16" font-weight="700">Pain points</text>
  <text x="260" y="458" fill="#3f3933" font-family="Arial,sans-serif" font-size="15">Consent fatigue � legal jargon � dark patterns � no central control</text>
